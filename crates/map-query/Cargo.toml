[package]
name = "map-query"
description = "Retriever, per-dimension scorers, fusion policies, federation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Dense dimensions need the embedder to encode queries. Without the `distilled`
# plugin a dense dimension's pack still loads, but querying it errors; the
# lexical dimensions are unaffected.
[features]
default = []
distilled = ["dep:map-embed", "map-embed/distilled"]

[dependencies]
map-core = { version = "0.0.2", path = "../map-core" }
map-format = { version = "0.0.2", path = "../map-format" }
map-stages = { version = "0.0.2", path = "../map-stages" }
map-embed = { version = "0.0.2", path = "../map-embed", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
thiserror = "2.0.19"
