[package]
name = "map-eval"
description = "Scores a retrieval run against graded relevance judgments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Querying a dense dimension needs the retriever to encode the query, so the
# default eval build has no embedder and pulls no tokenizer or model-loading
# code.
[features]
default = []
# map-query/distilled lets the retriever encode a dense query, which --fused,
# --descriptive, and a --dim that names a dense dimension need.
distilled = ["map-query/distilled"]

[dependencies]
map-core = { version = "0.0.4", path = "../map-core" }
map-query = { version = "0.0.4", path = "../map-query" }
map-stages = { version = "0.0.4", path = "../map-stages" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "map-eval"
path = "src/main.rs"
